name: Keep HF Spaces Awake

on:
  schedule:
    # Run every 12 hours (twice per day)
    - cron: '0 */12 * * *'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  wake-hf-spaces:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initial Ping - Frontend Space (Public)
        continue-on-error: true
        run: |
          echo "🔔 Pinging Frontend Space..."
          curl -X GET "https://mhmmohsen1-corbas-frontend.hf.space/health" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60 \
            --connect-timeout 10 \
            -v || echo "⚠️ Initial ping attempt failed (may be cold-starting)"
      
      - name: Initial Ping - Backend 1
        continue-on-error: true
        run: |
          echo "🔔 Pinging Backend 1..."
          curl -X GET "https://mhmmohsen1-backend.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60 \
            --connect-timeout 10 \
            -v || echo "⚠️ Initial ping attempt failed (may be cold-starting)"
      
      - name: Initial Ping - Backend 2
        continue-on-error: true
        run: |
          echo "🔔 Pinging Backend 2..."
          curl -X GET "https://mhmmohsen1-backendd.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60 \
            --connect-timeout 10 \
            -v || echo "⚠️ Initial ping attempt failed (may be cold-starting)"
      
      - name: Initial Ping - Backend 3
        continue-on-error: true
        run: |
          echo "🔔 Pinging Backend 3..."
          curl -X GET "https://mhmmohsen1-backenddd.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60 \
            --connect-timeout 10 \
            -v || echo "⚠️ Initial ping attempt failed (may be cold-starting)"
      
      - name: Initial Ping - Backend 4
        continue-on-error: true
        run: |
          echo "🔔 Pinging Backend 4..."
          curl -X GET "https://mhmmohsen1-backendddd.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60 \
            --connect-timeout 10 \
            -v || echo "⚠️ Initial ping attempt failed (may be cold-starting)"
      
      - name: Initial Ping - Backend 5
        continue-on-error: true
        run: |
          echo "🔔 Pinging Backend 5..."
          curl -X GET "https://mhmmohsen1-backenddddd.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60 \
            --connect-timeout 10 \
            -v || echo "⚠️ Initial ping attempt failed (may be cold-starting)"
      
      - name: Wait 90 seconds for cold-start
        run: sleep 90
      
      - name: Verify Frontend Space (Public)
        run: |
          echo "✅ Verifying Frontend Space..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mhmmohsen1-corbas-frontend.hf.space/health" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60)
          
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "✅ Frontend Space is responsive (HTTP $response)"
          else
            echo "❌ Frontend Space failed - HTTP $response"
            exit 1
          fi
      
      - name: Verify Backend 1
        run: |
          echo "✅ Verifying Backend 1..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mhmmohsen1-backend.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60)
          
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "✅ Backend 1 is responsive (HTTP $response)"
          else
            echo "❌ Backend 1 failed - HTTP $response"
            exit 1
          fi
      
      - name: Verify Backend 2
        run: |
          echo "✅ Verifying Backend 2..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mhmmohsen1-backendd.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60)
          
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "✅ Backend 2 is responsive (HTTP $response)"
          else
            echo "❌ Backend 2 failed - HTTP $response"
            exit 1
          fi
      
      - name: Verify Backend 3
        run: |
          echo "✅ Verifying Backend 3..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mhmmohsen1-backenddd.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60)
          
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "✅ Backend 3 is responsive (HTTP $response)"
          else
            echo "❌ Backend 3 failed - HTTP $response"
            exit 1
          fi
      
      - name: Verify Backend 4
        run: |
          echo "✅ Verifying Backend 4..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mhmmohsen1-backendddd.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60)
          
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "✅ Backend 4 is responsive (HTTP $response)"
          else
            echo "❌ Backend 4 failed - HTTP $response"
            exit 1
          fi
      
      - name: Verify Backend 5
        run: |
          echo "✅ Verifying Backend 5..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mhmmohsen1-backenddddd.hf.space/health" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-CorBaswakey" \
            -m 60)
          
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "✅ Backend 5 is responsive (HTTP $response)"
          else
            echo "❌ Backend 5 failed - HTTP $response"
            exit 1
          fi
      
      - name: Success Summary
        run: |
          echo "✅ All Hugging Face Spaces have been woken up successfully!"
          echo "⏰ Wake-up completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "📊 Next scheduled wake-up: in 12 hours"
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ FAILURE: One or more Hugging Face Spaces failed to wake up"
          echo "📋 Check the logs above for details"
          echo "🔗 Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
