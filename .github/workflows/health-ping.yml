name: Keep CorBas Backends Awake

on:
  schedule:
    # Run every 12 hours (twice per day)
    - cron: '0 */12 * * *'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  ping-backends:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend 1
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_1 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CorBaswakey }}" \
            -m 30 \
            --retry 3 \
            || echo "Backend 1 ping failed (this is OK if it's sleeping)"
      
      - name: Ping Backend 2
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_2 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CorBaswakey }}" \
            -m 30 \
            --retry 3 \
            || echo "Backend 2 ping failed (this is OK if it's sleeping)"
      
      - name: Ping Backend 3
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_3 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CorBaswakey }}" \
            -m 30 \
            --retry 3 \
            || echo "Backend 3 ping failed (this is OK if it's sleeping)"
      
      - name: Wait 2 minutes (allow backends to wake)
        run: sleep 120
      
      - name: Verify Backend 1
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_1 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CorBaswakey }}" \
            -m 30 \
            && echo "✅ Backend 1 is awake"
      
      - name: Verify Backend 2
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_2 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CorBaswakey }}" \
            -m 30 \
            && echo "✅ Backend 2 is awake"
      
      - name: Verify Backend 3
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_3 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CorBaswakey }}" \
            -m 30 \
            && echo "✅ Backend 3 is awake"
      
      - name: Send completion notification
        run: |
          echo "Health ping completed at $(date)"
          echo "All backends have been pinged to prevent sleep"
