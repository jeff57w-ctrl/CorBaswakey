name: Keep CorBas Backends Awake

on:
  schedule:
    # Run every 12 hours (twice per day)
    - cron: '0 */12 * * *'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  ping-backends:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend 1
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_1 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            --retry 3 \
            || echo "Backend 1 ping failed (this is OK if it's sleeping)"
      
      - name: Ping Backend 2
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_2 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            --retry 3 \
            || echo "Backend 2 ping failed (this is OK if it's sleeping)"
      
      - name: Ping Backend 3
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_3 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            --retry 3 \
            || echo "Backend 3 ping failed (this is OK if it's sleeping)"
      
      - name: Wait 2 minutes (allow backends to wake)
        run: sleep 120
      
      - name: Verify Backend 1
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_1 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            && echo "✅ Backend 1 is awake"
      
      - name: Verify Backend 2
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_2 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            && echo "✅ Backend 2 is awake"
      
      - name: Verify Backend 3
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_3 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            && echo "✅ Backend 3 is awake"









      - name: Ping Backend 4
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_4 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            --retry 3 \
            || echo "Backend 4 ping failed (this is OK if it's sleeping)"
      
      - name: Ping Backend 5
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_5 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            --retry 3 \
            || echo "Backend 5 ping failed (this is OK if it's sleeping)"
      
      - name: Ping Frontend 1
        run: |
          curl -X GET "${{ secrets.FRONTEND_URL_1 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            --retry 3 \
            || echo "Frontend 1 ping failed (this is OK if it's sleeping)"
      
      - name: Wait 2 minutes (allow backends to wake)
        run: sleep 120
      
      - name: Verify Backend 4
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_4 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            && echo "✅ Backend 4 is awake"
      
      - name: Verify Backend 5
        run: |
          curl -X GET "${{ secrets.BACKEND_URL_5 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            && echo "✅ Backend 5 is awake"
      
      - name: Verify Frontend 1
        run: |
          curl -X GET "${{ secrets.FRONTEND_URL_1 }}/health" \
            -H "Authorization: Bearer ${{ secrets.CORBASWAKEY }}" \
            -m 30 \
            && echo "✅ Frontend 1 is awake"









     







      
      - name: Send completion notification
        run: |
          echo "Health ping completed at $(date)"
          echo "All backends have been pinged to prevent sleep"
